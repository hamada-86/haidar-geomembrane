<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APO HAIDAR - الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --primary: #00bcd4; --gold: #FFD700; --bg: #0a0a12; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #fff; margin: 0; }
        
        /* Nav Bar الموحد */
        .nav-bar { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 20px 0; text-align: center; border-bottom: 2px solid var(--primary); z-index: 1000; }
        .nav-bar a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: bold; transition: 0.3s; }
        .nav-bar a:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://i.imgur.com/g8LqJc3.jpg') center/cover; }
        .hero h1 { font-family: 'Orbitron'; font-size: 4em; color: var(--gold); text-shadow: 0 0 20px var(--gold); margin: 0; }
        .egyptian-logo { width: 150px; filter: drop-shadow(0 0 15px var(--gold)); margin-bottom: 20px; }
        .btn { background: var(--primary); color: #000; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 20px; box-shadow: 0 0 15px var(--primary); transition: 0.3s; }
        .btn:hover { transform: scale(1.1); background: #fff; }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="index.html">الرئيسية</a>
        <a href="services.html">خدماتنا</a>
        <a href="gallery.html">معرض الصور</a>
        <a href="contact.html">اتصل بنا</a>
    </nav>

    <section class="hero">
        <img src="https://i.imgur.com/lJ41j2W.png" class="egyptian-logo" alt="Logo">
        <h1>APO HAIDAR</h1>
        <p style="font-size: 1.5em; max-width: 800px;">رائد عزل الجيوممبرين في مصر - بحيرات، حمامات سباحة، وأحواض زراعية</p>
        <div style="margin-top: 30px;">
            <a href="services.html" class="btn">اكتشف خدماتنا</a>
            <a href="contact.html" class="btn" style="background: var(--gold); box-shadow: 0 0 15px var(--gold); margin-right: 10px;">اطلب تسعير الآن</a>
        </div>
    </section>

</body>
</html>
